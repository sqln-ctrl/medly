version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medly
      POSTGRES_USER: medly
      POSTGRES_PASSWORD: medly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: medly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
